# Builds the Docker image on GitHub's servers and deploys Remixt to Cloudflare
# (remixt.app). App secrets live on the Worker already (set once by
# cloudflare/deploy.sh or `wrangler secret`), so only a Cloudflare token is needed.
name: Deploy to Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-cloudflare
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install wrangler
        working-directory: cloudflare
        run: npm ci --no-audit --no-fund
      # Wrangler's own message for a token that can't touch Containers is just
      # "A request to the Cloudflare API (/containers/me) failed." with no
      # reason, so ask the API directly and name the missing permission.
      - name: Check Cloudflare token
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN is not set. Add it under Settings → Secrets and variables → Actions."
            exit 1
          fi
          code=$(curl -sS -o /tmp/containers-me.json -w '%{http_code}' \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/1c36090945aa92ebdf4a0c839f53f6b9/containers/me")
          echo "GET /accounts/1c36090945aa92ebdf4a0c839f53f6b9/containers/me -> HTTP $code"
          cat /tmp/containers-me.json; echo
          if [ "$code" != "200" ]; then
            echo "::error::This token cannot use Cloudflare Containers. Create/edit the API token and give it, for the account 1c36090945aa92ebdf4a0c839f53f6b9: Workers Scripts: Edit, Cloudflare Containers: Edit, Workers R2 Storage: Edit, Account Settings: Read; and for the zone remixt.app: Workers Routes: Edit, DNS: Edit, Zone: Read."
            exit 1
          fi
      - name: Deploy
        working-directory: cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 1c36090945aa92ebdf4a0c839f53f6b9
        run: npx wrangler deploy
      # The deploy is only done when the site answers. The container may be
      # waking up or rolling to the new image, so each page gets a few tries.
      # A page that keeps failing fails the run (GitHub emails the owner).
      #
      # Cloudflare's bot protection can answer 403 to GitHub's datacenter IPs
      # while the site is fine for everyone else. The check sends the secret
      # SITE_CHECK_TOKEN in an X-Site-Check header, and a WAF custom rule on
      # remixt.app skips the bot checks for requests that carry it:
      #   Security → WAF → Custom rules → Create rule
      #   Expression: (any(http.request.headers["x-site-check"][*] eq "<token>"))
      #   Action: Skip — all remaining custom rules, Rate limiting rules,
      #           Managed rules, Super Bot Fight Mode rules
      # The plain (free-plan) Bot Fight Mode can't be skipped by a rule; if that
      # is what blocks the check, it has to be turned off under Security → Bots.
      - name: Check the live site
        env:
          SITE_CHECK_TOKEN: ${{ secrets.SITE_CHECK_TOKEN }}
        run: |
          set -u
          base=https://remixt.app
          if [ -z "$SITE_CHECK_TOKEN" ]; then
            echo "::warning::SITE_CHECK_TOKEN is not set, so Cloudflare may block this check with 403. Add it under Settings → Secrets and variables → Actions."
          fi
          check_header="X-Site-Check: ${SITE_CHECK_TOKEN:-none}"
          sleep 20
          failed=0
          blocked=0
          for path in / /plus /library /remixes /radio /dj /studio /examples /tools /login /signup /forgot-password /api/billing /api/version /sitemap.xml /robots.txt; do
            ok=0
            for try in 1 2 3 4 5 6; do
              code=$(curl -s -o /dev/null -w '%{http_code}' -m 60 -H "$check_header" "$base$path" || echo 000)
              if [ "$code" = "200" ]; then ok=1; break; fi
              # A 403 is Cloudflare refusing this runner, not the app waking up;
              # retrying won't change it.
              if [ "$code" = "403" ]; then blocked=1; break; fi
              sleep 10
            done
            if [ $ok = 1 ]; then echo "ok   $path"; else echo "::error::$path answered $code"; failed=1; fi
          done
          if [ $blocked = 1 ]; then
            echo "::error::Cloudflare answered 403 to this GitHub runner. The deploy itself succeeded. Check Security → Events on remixt.app, and that the WAF rule skipping requests with the X-Site-Check header matches the SITE_CHECK_TOKEN secret."
          fi
          # Static files come from Cloudflare's edge cache (cloudflare/src/index.ts).
          asset=$(curl -s -m 60 -H "$check_header" "$base/" | grep -o '/_next/static/[^"]*\.js' | head -1)
          if [ -n "$asset" ]; then
            curl -s -o /dev/null -m 60 -H "$check_header" "$base$asset"
            hit=$(curl -sI -m 60 -H "$check_header" "$base$asset" | tr -d '\r' | awk -F': ' 'tolower($1)=="x-edge-cache"{print $2}')
            echo "edge cache for $asset: ${hit:-MISS}"
          fi
          exit $failed
