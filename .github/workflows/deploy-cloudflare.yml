# Builds the Docker image on GitHub's servers and deploys Remixt to Cloudflare
# (remixt.app). App secrets live on the Worker already (set once by
# cloudflare/deploy.sh or `wrangler secret`), so only a Cloudflare token is needed.
name: Deploy to Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-cloudflare
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install wrangler
        working-directory: cloudflare
        run: npm ci --no-audit --no-fund
      # Wrangler's own message for a token that can't touch Containers is just
      # "A request to the Cloudflare API (/containers/me) failed." with no
      # reason, so ask the API directly and name the missing permission.
      - name: Check Cloudflare token
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN is not set. Add it under Settings → Secrets and variables → Actions."
            exit 1
          fi
          code=$(curl -sS -o /tmp/containers-me.json -w '%{http_code}' \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/1c36090945aa92ebdf4a0c839f53f6b9/containers/me")
          echo "GET /accounts/1c36090945aa92ebdf4a0c839f53f6b9/containers/me -> HTTP $code"
          cat /tmp/containers-me.json; echo
          if [ "$code" != "200" ]; then
            echo "::error::This token cannot use Cloudflare Containers. Create/edit the API token and give it, for the account 1c36090945aa92ebdf4a0c839f53f6b9: Workers Scripts: Edit, Cloudflare Containers: Edit, Workers R2 Storage: Edit, Account Settings: Read; and for the zone remixt.app: Workers Routes: Edit, DNS: Edit, Zone: Read."
            exit 1
          fi
      - name: Deploy
        working-directory: cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 1c36090945aa92ebdf4a0c839f53f6b9
        run: npx wrangler deploy
      # Workers custom domains normally create their DNS record themselves,
      # but remixt.app's apex A record disappeared twice while the AAAA stayed,
      # which leaves IPv4-only visitors unable to resolve the site. Add it back
      # if it is missing (a proxied dummy A is what a Worker custom domain uses).
      - name: Ensure remixt.app has a proxied A record
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ZONE_ID: 41d428294eedab59002445012ea34e57
        run: |
          api="https://api.cloudflare.com/client/v4/zones/$ZONE_ID/dns_records"
          body=$(curl -sS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$api?type=A&name=remixt.app")
          echo "$body" | jq .
          if [ "$(echo "$body" | jq -r '.success')" != "true" ]; then
            echo "::error::The token cannot read DNS records. Add the zone permission 'DNS: Edit' for remixt.app to CLOUDFLARE_API_TOKEN."
            exit 1
          fi
          if [ "$(echo "$body" | jq '.result | length')" -gt 0 ]; then
            echo "Apex A record already present."
            exit 0
          fi
          echo "Creating proxied A 192.0.2.1 for remixt.app…"
          curl -sS -X POST -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -H 'Content-Type: application/json' \
            --data '{"type":"A","name":"remixt.app","content":"192.0.2.1","proxied":true,"ttl":1}' \
            "$api" | jq .
